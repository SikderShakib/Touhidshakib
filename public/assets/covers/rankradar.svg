      <stop offset="0" stop-color="#1b1a4d" />
      <stop offset="0.62" stop-color="#0b0d16" />
      <stop offset="1" stop-color="#06070d" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.36" r="0.62">
