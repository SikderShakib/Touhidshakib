          <circle cx="180" cy="-80" r="5" fill="#818cf8" /><circle cx="96" cy="120" r="5" fill="#818cf8" /><circle cx="-110" cy="-150" r="5" fill="#818cf8" /><circle cx="230" cy="60" r="5" fill="#818cf8" />
